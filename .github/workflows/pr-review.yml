name: PR Review (무료 에이전트)

# PR diff를 무료 LLM(Groq, OpenAI 호환)에 보내 리뷰 요약 코멘트를 자동으로
# 남깁니다. SKYAHO/Autoresearch의 claude.yml 구조를 이식하되, 유료 Claude 구독
# 토큰 대신 무료 티어 API 키(GROQ_API_KEY 시크릿)를 씁니다.
# 키 발급: https://console.groq.com (신용카드 불필요)
#
# - 문서만 바뀌는 PR은 자동 트리거에서 제외합니다 (paths-ignore). 코드+문서
#   혼합 PR은 리뷰되고, 문서 PR도 `/pr-review` 코멘트로 수동 실행할 수 있습니다.
# - required check가 아니며, 시크릿 미설정·API 실패 시에도 머지를 막지 않습니다
#   (soft-fail — 안내 코멘트만 남기고 워크플로는 성공 처리).
# - 모델은 아래 GROQ_MODEL 한 줄로 교체합니다. 무료 Groq 키는 openai/gpt-oss-*
#   계열만 접근 가능하며, 추론 모델이라 max_tokens를 넉넉히·reasoning fallback을 둡니다.
# - 인라인 리뷰 코멘트는 무료 모델의 라인 앵커 신뢰도 문제로 제외했습니다.

on:
  pull_request:
    types: [opened, ready_for_review]
    paths-ignore:
      - "**.md"
      - "docs/**"
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "리뷰할 PR 번호"
        required: true

jobs:
  review:
    if: |
      (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        contains(github.event.comment.body, '/pr-review')
      )
    runs-on: ubuntu-latest
    concurrency:
      group: pr-review-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: openai/gpt-oss-120b
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
      MARKER: "<!-- pr-review-agent -->"
    steps:
      - name: Review PR and upsert sticky comment
        run: |
          # shellcheck disable=SC2016
          set -uo pipefail

          # MARKER로 시작하는 기존 코멘트가 있으면 갱신, 없으면 생성. 본문은 comment.md.
          post() {
            local cid
            cid=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
              --jq "map(select(.body | startswith(\"${MARKER}\"))) | .[0].id // empty")
            if [ -n "$cid" ]; then
              gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${cid}" -F body=@comment.md --silent
            else
              gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -F body=@comment.md --silent
            fi
          }

          fail_soft() {
            {
              printf '%s\n' "$MARKER"
              printf '## 🤖 자동 코드 리뷰\n\n'
              printf '리뷰 생성에 실패했습니다: %s\n\n' "$1"
              printf '워크플로 로그: %s/%s/actions/runs/%s\n\n' \
                "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
              printf '%s\n' 'GROQ_API_KEY 시크릿 설정 여부를 확인한 뒤 PR에 "/pr-review" 코멘트로 재시도하십시오.'
            } > comment.md
            post || true
            exit 0
          }

          [ -n "${GROQ_API_KEY}" ] || fail_soft 'GROQ_API_KEY 시크릿이 설정되지 않았습니다.'

          gh pr diff "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --patch > pr.diff \
            || fail_soft 'PR diff를 가져오지 못했습니다.'
          head -c 60000 pr.diff > pr.diff.cut && mv pr.diff.cut pr.diff   # 무료 티어 입력 한도 대비 절단
          [ -s pr.diff ] || fail_soft 'diff가 비어 있습니다.'

          SYSTEM='당신은 이 저장소의 코드 리뷰어입니다. 한국어 격식체로 답하십시오. 발견 사항을 심각도 순으로 먼저 제시하십시오: (1) 정확성 버그·기존 동작의 의도치 않은 변경, (2) 시크릿/자격 증명 노출, (3) 입력 검증 누락·권한 확대, (4) 불필요한 복잡도·중복(기존 코드로 대체 가능한지), (5) 테스트 누락. 각 발견에 파일·라인 참조를 붙이고 1~2문장으로 간결하게. 칭찬은 나열하지 않습니다. 마지막에 "## 이해도 확인" 절을 두고 이 PR의 핵심 로직에 대해 작성자가 답해야 하는 구체적 질문을 1~3개 적습니다(일반론 금지, diff에 근거, 답은 쓰지 않음). 변경이 사소하거나 문서·포맷 전용이면 "특이사항 없음"만 적습니다. (기준: .claude/docs/agent-peer-review.md)'

          jq -n --arg m "$GROQ_MODEL" --arg s "$SYSTEM" --rawfile d pr.diff \
            '{
               model: $m,
               messages: [
                 { role: "system", content: $s },
                 { role: "user", content: ("다음은 PR의 통합 diff입니다:\n\n```diff\n" + $d + "\n```") }
               ],
               max_tokens: 8192,
               temperature: 0.3,
               reasoning_effort: "medium"
             }' > body.json

          HTTP=$(curl -sS -w '%{http_code}' -o resp.json -X POST \
            "https://api.groq.com/openai/v1/chat/completions" \
            -H "Authorization: Bearer ${GROQ_API_KEY}" \
            -H 'content-type: application/json' \
            --data @body.json) || fail_soft 'Groq API 호출에 실패했습니다.'

          [ "$HTTP" = "200" ] || fail_soft "Groq API가 HTTP ${HTTP} 응답: $(jq -r '.error.message // "알 수 없는 오류"' resp.json 2>/dev/null)"

          # gpt-oss 계열은 추론 모델이라 content가 비면 reasoning으로 대체한다.
          REVIEW=$(jq -r '.choices[0].message as $m
            | if (($m.content // "") != "") then $m.content else ($m.reasoning // "") end' resp.json)
          [ -n "$REVIEW" ] && [ "$REVIEW" != "null" ] \
            || fail_soft "응답에 리뷰 본문이 없습니다 (finish_reason: $(jq -r '.choices[0].finish_reason // "?"' resp.json))."

          {
            printf '%s\n' "$MARKER"
            printf '## 🤖 자동 코드 리뷰 (%s)\n\n' "$GROQ_MODEL"
            printf '%s\n\n' "$REVIEW"
            printf '%s\n' '---'
            # shellcheck disable=SC2016
            printf '%s\n' '_무료 에이전트가 자동 생성했습니다. 코드가 갱신되면 PR에 `/pr-review` 코멘트를 남겨 재실행할 수 있습니다. required check가 아니며 참고용입니다._'
          } > comment.md
          post
