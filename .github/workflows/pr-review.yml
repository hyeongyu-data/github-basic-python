name: PR Review (무료 에이전트)

# PR diff를 무료 LLM(Google Gemini 무료 티어)에 보내 리뷰 요약 코멘트를
# 자동으로 남깁니다. SKYAHO/Autoresearch의 claude.yml 구조를 이식하되,
# 유료 Claude 구독 토큰 대신 무료 티어 API 키(GEMINI_API_KEY 시크릿)를 씁니다.
#
# - 문서만 바뀌는 PR은 자동 트리거에서 제외합니다 (paths-ignore). 코드+문서
#   혼합 PR은 리뷰되고, 문서 PR도 `/pr-review` 코멘트로 수동 실행할 수 있습니다.
# - required check가 아니며, 시크릿 미설정·API 실패 시에도 머지를 막지 않습니다
#   (soft-fail — 안내 코멘트만 남기고 워크플로는 성공 처리).
# - 모델은 아래 GEMINI_MODEL 한 줄로 교체할 수 있습니다.
# - 인라인 리뷰 코멘트는 무료 모델의 라인 앵커 신뢰도 문제로 제외했습니다.

on:
  pull_request:
    types: [opened, ready_for_review]
    paths-ignore:
      - "**.md"
      - "docs/**"
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "리뷰할 PR 번호"
        required: true

jobs:
  review:
    if: |
      (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        contains(github.event.comment.body, '/pr-review')
      )
    runs-on: ubuntu-latest
    concurrency:
      group: pr-review-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-2.5-flash
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
      MARKER: "<!-- pr-review-agent -->"
    steps:
      - name: Review PR and upsert sticky comment
        run: |
          # shellcheck disable=SC2016
          set -uo pipefail

          # MARKER로 시작하는 기존 코멘트가 있으면 갱신, 없으면 생성. 본문은 comment.md.
          post() {
            local cid
            cid=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
              --jq "map(select(.body | startswith(\"${MARKER}\"))) | .[0].id // empty")
            if [ -n "$cid" ]; then
              gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${cid}" -F body=@comment.md --silent
            else
              gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -F body=@comment.md --silent
            fi
          }

          fail_soft() {
            {
              printf '%s\n' "$MARKER"
              printf '## 🤖 자동 코드 리뷰\n\n'
              printf '리뷰 생성에 실패했습니다: %s\n\n' "$1"
              printf '워크플로 로그: %s/%s/actions/runs/%s\n\n' \
                "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
              printf '%s\n' 'GEMINI_API_KEY 시크릿 설정 여부를 확인한 뒤 PR에 "/pr-review" 코멘트로 재시도하십시오.'
            } > comment.md
            post || true
            exit 0
          }

          [ -n "${GEMINI_API_KEY}" ] || fail_soft 'GEMINI_API_KEY 시크릿이 설정되지 않았습니다.'

          gh pr diff "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --patch > pr.diff \
            || fail_soft 'PR diff를 가져오지 못했습니다.'
          head -c 60000 pr.diff > pr.diff.cut && mv pr.diff.cut pr.diff   # 무료 티어 입력 한도 대비 절단
          [ -s pr.diff ] || fail_soft 'diff가 비어 있습니다.'

          SYSTEM='당신은 꼼꼼한 코드 리뷰어입니다. 아래 PR diff를 리뷰하고 한국어 격식체로 답하십시오. 심각도 순으로 구체적인 발견 사항을 먼저 제시하십시오: (1) 정확성 버그·의도치 않은 동작 변경, (2) 시크릿/자격 증명 노출, (3) 불필요한 복잡도·중복, (4) 테스트 누락. 각 항목은 파일·함수를 명시하고 1~2문장으로 간결하게. 발견 사항이 없으면 그렇게 적으십시오. 마지막에 2~3문장 요약. Markdown 사용, 과도한 머리말 없이.'

          jq -n --arg s "$SYSTEM" --rawfile d pr.diff \
            '{
               system_instruction: { parts: [ { text: $s } ] },
               contents: [ { role: "user", parts: [ { text: ("다음은 PR의 통합 diff입니다:\n\n```diff\n" + $d + "\n```") } ] } ],
               generationConfig: { temperature: 0.2 }
             }' > body.json

          HTTP=$(curl -sS -w '%{http_code}' -o resp.json -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent" \
            -H "x-goog-api-key: ${GEMINI_API_KEY}" \
            -H 'content-type: application/json' \
            --data @body.json) || fail_soft 'Gemini API 호출에 실패했습니다.'

          [ "$HTTP" = "200" ] || fail_soft "Gemini API가 HTTP ${HTTP} 응답: $(jq -r '.error.message // "알 수 없는 오류"' resp.json 2>/dev/null)"

          REVIEW=$(jq -r '[.candidates[0].content.parts[]?.text] | join("")' resp.json)
          [ -n "$REVIEW" ] && [ "$REVIEW" != "null" ] \
            || fail_soft "응답에 리뷰 본문이 없습니다 (finishReason: $(jq -r '.candidates[0].finishReason // "?"' resp.json))."

          {
            printf '%s\n' "$MARKER"
            printf '## 🤖 자동 코드 리뷰 (%s)\n\n' "$GEMINI_MODEL"
            printf '%s\n\n' "$REVIEW"
            printf '%s\n' '---'
            # shellcheck disable=SC2016
            printf '%s\n' '_무료 에이전트가 자동 생성했습니다. 코드가 갱신되면 PR에 `/pr-review` 코멘트를 남겨 재실행할 수 있습니다. required check가 아니며 참고용입니다._'
          } > comment.md
          post
